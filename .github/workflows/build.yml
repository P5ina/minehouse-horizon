name: build

# MineHouse Horizon: Horizon (horizon.json's revision) with MineHouse's native mods applied,
# compiled once here for every platform, so players never build the game themselves.
# The artifacts are the game executables only; the launcher puts one in place of the
# executable of the Horizon Nightly named in horizon.json, as Horizon's own launcher installs a
# native build (docs/native-mods.md, "Install").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to create from this run (v*), empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Linux audio headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Mods' own tests
        run: |
          cargo test --manifest-path mods/pingwheel/Cargo.toml
          cargo test --manifest-path mods/minehouse/Cargo.toml
          cargo test --manifest-path mods/appleskin/Cargo.toml
          cargo test --manifest-path mods/chatheads/Cargo.toml
          cargo test --manifest-path mods/fasttrading/Cargo.toml
          cargo test --manifest-path mods/autoclicker/Cargo.toml
          cargo test --manifest-path mods/worldmap/Cargo.toml
          cargo test --manifest-path mods/litematica/mixins/litematica/engine/Cargo.toml
          cargo test --manifest-path mods/minimap/Cargo.toml
          cargo test --manifest-path mods/zoom/Cargo.toml
          cargo test --manifest-path mods/plasmovoice/mixins/plasmovoice/engine/Cargo.toml --release

  exporters:
    # Horizon's Java exporters for the pinned commit, compiled against Minecraft downloaded from
    # Mojang here: Horizon deletes a dated Nightly after a few days, so our release carries the
    # Horizon files the launcher needs (horizon-prepare and these classes) itself. Only Horizon's
    # own compiled classes leave the runner; the game files stay on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pins
        id: pins
        run: echo "horizon=$(jq -r .horizon_revision horizon.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.pins.outputs.horizon }}
          path: horizon-src
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            minecraft
            horizon-src/target
          key: exporters-${{ steps.rust.outputs.cachekey }}-${{ steps.pins.outputs.horizon }}
          restore-keys: exporters-${{ steps.rust.outputs.cachekey }}-
      - name: Minecraft from Mojang
        run: python3 tools/fetch_minecraft.py horizon-src/research-lock.json minecraft
      - name: Compile the exporters
        working-directory: horizon-src
        run: |
          set -euo pipefail
          cargo build --release --locked -p horizon-prepare
          target/release/horizon-prepare --prepare --minecraft-dir "$GITHUB_WORKSPACE/minecraft" \
            --server-jar "$GITHUB_WORKSPACE/minecraft/server/server-$(jq -r .minecraft.version research-lock.json).jar" \
            --java-home "$JAVA_HOME" --root "$PWD"
          bundle=$(target/release/horizon-prepare compile-exporters --root "$PWD" | tail -1)
          mkdir -p "$GITHUB_WORKSPACE/exporters"
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" "$GITHUB_WORKSPACE/exporters/"
          # Only Horizon's classes and their manifest leave this runner.
          cd "$GITHUB_WORKSPACE"
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of Horizon's classes: $stray"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-exporters
          path: exporters/
          if-no-files-found: error

  build:
    needs: [test, exporters]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
            exe: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - name: Pins
        id: pins
        shell: bash
        run: |
          echo "horizon=$(jq -r .horizon_revision horizon.json)" >> "$GITHUB_OUTPUT"
          echo "mixins=$(jq -r .horizon_mixins_revision horizon.json)" >> "$GITHUB_OUTPUT"
          echo "nightly=$(jq -r .horizon_nightly horizon.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.pins.outputs.horizon }}
          path: horizon-src
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mixins-bin
            stage-target
            prepare-target
          # The compiler in the key: a new stable reading crates the old one built crashed rustc
          # ("invalid enum variant tag while decoding").
          key: ${{ matrix.name }}-${{ steps.rust.outputs.cachekey }}-${{ steps.pins.outputs.horizon }}-${{ hashFiles('mods/**') }}
          restore-keys: |
            ${{ matrix.name }}-${{ steps.rust.outputs.cachekey }}-${{ steps.pins.outputs.horizon }}-
            ${{ matrix.name }}-${{ steps.rust.outputs.cachekey }}-
      - name: horizon-mixins
        shell: bash
        run: |
          # The pinned tool with Horizon's own carried patch (tools/mixins/ in Horizon, copied) and
          # ours (tools/horizon-mixins-*.patch), built once per pin and patch set.
          set -euo pipefail
          stamp="${{ steps.pins.outputs.mixins }}-${{ hashFiles('tools/horizon-mixins-*.patch') }}"
          if [ "$(cat mixins-bin/stamp 2>/dev/null)" != "$stamp" ]; then
            rm -rf mixins-src mixins-bin
            git -c core.autocrlf=false clone -q https://github.com/horizon-rust/horizon-mixins mixins-src
            git -C mixins-src checkout -q ${{ steps.pins.outputs.mixins }}
            for patch in tools/horizon-mixins-*.patch; do git -C mixins-src apply "$PWD/$patch"; done
            cargo install --locked --path mixins-src/crates/horizon-mixins-cli --root mixins-bin
            echo "$stamp" > mixins-bin/stamp
          fi
          echo "${{ github.workspace }}/mixins-bin/bin" >> "$GITHUB_PATH"
      - name: Horizon's files beside the game
        shell: bash
        run: |
          # What Horizon's own Nightly archive holds besides the programs (xtask's ARCHIVED), from
          # the pinned commit, before stage.py takes the checkout's .git away.
          mkdir -p horizon-dist/horizon-${{ matrix.name }}
          git -C horizon-src archive --format=tar HEAD tools mods/horizon/src/test/java crates/horizon-prepare research-lock.json LICENSE packaging/PLAY.txt \
            | tar x -C horizon-dist/horizon-${{ matrix.name }}
          mv horizon-dist/horizon-${{ matrix.name }}/packaging/PLAY.txt horizon-dist/horizon-${{ matrix.name }}/PLAY.txt
          rmdir horizon-dist/horizon-${{ matrix.name }}/packaging
          # Mojang republishes 26.3.json now and then; the pinned commit's lock doesn't know the
          # newer copies yet (tools/lock-accept.json lists them, from Horizon's later lock).
          lock=horizon-dist/horizon-${{ matrix.name }}/research-lock.json
          jq --slurpfile extra tools/lock-accept.json '
            .minecraft.accepted_manifest_sha1 = ((.minecraft.accepted_manifest_sha1 // []) + $extra[0].accepted_manifest_sha1 | unique)
            | .minecraft.accepted_asset_index_sha1 = ((.minecraft.accepted_asset_index_sha1 // []) + $extra[0].accepted_asset_index_sha1 | unique)
          ' "$lock" > "$lock.new"
          mv "$lock.new" "$lock"
      - name: horizon-prepare
        shell: bash
        run: cargo build --manifest-path horizon-src/Cargo.toml --locked --profile release -p horizon-prepare --bin horizon-prepare
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/prepare-target
      - name: Apply the mods
        shell: bash
        run: python3 tools/stage.py horizon-src stage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/prepare-target
      - name: Compile
        shell: bash
        run: |
          # As the Horizon launcher compiles a native build: the stage's own Cargo config and its
          # mod API injections (docs/native-mods.md, "Compile").
          args=()
          [ -f stage/.cargo/config.toml ] && args+=(--config stage/.cargo/config.toml)
          [ -f stage/.horizon-mod-api-injections.json ] && export HORIZON_MOD_API_INJECTIONS="$PWD/stage/.horizon-mod-api-injections.json"
          # The mods feature, while the revision still has it (the launcher's `has_mods_feature`).
          grep -q '^mods *=' stage/crates/horizon-client/Cargo.toml && args+=(--features horizon-client/mods)
          cargo build "${args[@]}" --manifest-path stage/Cargo.toml --locked --profile release -p horizon-game --bin horizon-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/stage-target
          # The stage has no .git: the build's identity is the pinned commit.
          HORIZON_GAME_BUILD_ID: ${{ steps.pins.outputs.horizon }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "stage-target/release/horizon-client${{ matrix.exe }}" "dist/horizon-client${{ matrix.exe }}"
          jq -n --arg h "${{ steps.pins.outputs.horizon }}" --arg n "${{ steps.pins.outputs.nightly }}" --arg c "${{ github.sha }}" \
            --arg p "${{ matrix.name }}" --slurpfile mods mods.json \
            '{horizon_revision:$h, horizon_nightly:$n, minehouse_commit:$c, platform:$p, mods:$mods[0]}' > dist/minehouse-horizon.json
          cd dist && if [ "${{ runner.os }}" = Windows ]; then 7z a ../minehouse-horizon-${{ matrix.name }}.zip . ; else zip -r ../minehouse-horizon-${{ matrix.name }}.zip . ; fi
      - uses: actions/download-artifact@v4
        with:
          name: horizon-exporters
          path: horizon-dist/horizon-${{ matrix.name }}/exporters
      - name: Package Horizon's files
        # horizon-<rev12>-horizon-<platform>.zip (.tar.gz on Linux), laid out as Horizon's own
        # Nightly archive; the launcher puts our horizon-client into it.
        shell: bash
        run: |
          set -euo pipefail
          cp "prepare-target/release/horizon-prepare${{ matrix.exe }}" "horizon-dist/horizon-${{ matrix.name }}/"
          rev=$(jq -r .horizon_revision horizon.json | cut -c1-12)
          cd horizon-dist
          case "${{ matrix.name }}" in
            linux-*) tar czf "../horizon-$rev-horizon-${{ matrix.name }}.tar.gz" "horizon-${{ matrix.name }}" ;;
            windows-*) 7z a -tzip "../horizon-$rev-horizon-${{ matrix.name }}.zip" "horizon-${{ matrix.name }}" > /dev/null ;;
            *) zip -qr "../horizon-$rev-horizon-${{ matrix.name }}.zip" "horizon-${{ matrix.name }}" ;;
          esac
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare from the package (Linux)
        # The launcher's own call, with the files packaged above: proves the exporters and the
        # preparer fit together before a release ships them.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check && tar xzf horizon-*-horizon-${{ matrix.name }}.tar.gz -C check
          python3 tools/fetch_minecraft.py horizon-src/research-lock.json minecraft > /dev/null
          version=$(jq -r .minecraft.version horizon-src/research-lock.json)
          check/horizon-${{ matrix.name }}/horizon-prepare --prepare --minecraft-dir "$PWD/minecraft" \
            --server-jar "$PWD/minecraft/server/server-$version.jar" --java-home "$JAVA_HOME" \
            --output "$PWD/check-resources" --complete --progress json | tail -3
          check/horizon-${{ matrix.name }}/horizon-prepare --check --output "$PWD/check-resources"
      - uses: actions/upload-artifact@v4
        with:
          name: minehouse-horizon-${{ matrix.name }}
          path: |
            minehouse-horizon-${{ matrix.name }}.zip
            horizon-*-horizon-${{ matrix.name }}.*

  release:
    # A pushed v* tag, or a manual run with a v* `release` input (the tag is created on the run's commit).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS
          gh release create "${TAG}" *.zip *.tar.gz SHA256SUMS --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "MineHouse Horizon ${TAG}" --generate-notes
