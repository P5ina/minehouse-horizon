name: build

# MineHouse Horizon: Horizon (horizon.json's revision) with MineHouse's native mods applied,
# compiled once here for every platform, so players never build the game themselves.
# The artifacts are the game executables only; the launcher puts one in place of the
# executable of the Horizon Nightly named in horizon.json, as Horizon's own launcher installs a
# native build (docs/native-mods.md, "Install").

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Mods' own tests
        run: |
          cargo test --manifest-path mods/pingwheel/Cargo.toml
          cargo test --manifest-path mods/plasmovoice/mixins/plasmovoice/engine/Cargo.toml --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
            exe: .exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - name: Pins
        id: pins
        shell: bash
        run: |
          echo "horizon=$(jq -r .horizon_revision horizon.json)" >> "$GITHUB_OUTPUT"
          echo "mixins=$(jq -r .horizon_mixins_revision horizon.json)" >> "$GITHUB_OUTPUT"
          echo "nightly=$(jq -r .horizon_nightly horizon.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.pins.outputs.horizon }}
          path: horizon-src
          lfs: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/horizon-mixins*
            stage-target
          key: ${{ matrix.name }}-${{ steps.pins.outputs.horizon }}-${{ hashFiles('mods/**') }}
          restore-keys: |
            ${{ matrix.name }}-${{ steps.pins.outputs.horizon }}-
            ${{ matrix.name }}-
      - name: horizon-mixins
        shell: bash
        run: |
          command -v horizon-mixins || cargo install --locked --git https://github.com/horizon-rust/horizon-mixins --rev ${{ steps.pins.outputs.mixins }} horizon-mixins-cli
      - name: Apply the mods
        shell: bash
        run: python3 tools/stage.py horizon-src stage
      - name: Compile
        shell: bash
        run: |
          # As the Horizon launcher compiles a native build: the stage's own Cargo config and its
          # mod API injections (docs/native-mods.md, "Compile").
          args=()
          [ -f stage/.cargo/config.toml ] && args+=(--config stage/.cargo/config.toml)
          [ -f stage/.horizon-mod-api-injections.json ] && export HORIZON_MOD_API_INJECTIONS="$PWD/stage/.horizon-mod-api-injections.json"
          # The mods feature, while the revision still has it (the launcher's `has_mods_feature`).
          grep -q '^mods *=' stage/crates/horizon-client/Cargo.toml && args+=(--features horizon-client/mods)
          cargo build "${args[@]}" --manifest-path stage/Cargo.toml --locked --profile release -p horizon-client --bin horizon-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/stage-target
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "stage-target/release/horizon-client${{ matrix.exe }}" "dist/horizon-client${{ matrix.exe }}"
          jq -n --arg h "${{ steps.pins.outputs.horizon }}" --arg n "${{ steps.pins.outputs.nightly }}" --arg c "${{ github.sha }}" \
            --arg p "${{ matrix.name }}" '{horizon_revision:$h, horizon_nightly:$n, minehouse_commit:$c, platform:$p}' > dist/minehouse-horizon.json
          cd dist && if [ "${{ runner.os }}" = Windows ]; then 7z a ../minehouse-horizon-${{ matrix.name }}.zip . ; else zip -r ../minehouse-horizon-${{ matrix.name }}.zip . ; fi
      - uses: actions/upload-artifact@v4
        with:
          name: minehouse-horizon-${{ matrix.name }}
          path: minehouse-horizon-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.zip > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" *.zip SHA256SUMS --repo "${GITHUB_REPOSITORY}" --title "MineHouse Horizon ${GITHUB_REF_NAME}" --generate-notes
