[mod]
id = "controlling"
version = "26.3.5"
priority = 100

[compatibility]
horizon_revision = "f037744a79f9982c47876f49c5a3067279f88706"

# Key Binds' search box matches a binding's key and category too, not only its
# name: once the game has filtered and sorted the list (at `list_start`), the
# list is made again from every binding with the wider match.
[[injection]]
id = "search"
kind = "MODIFY_VARIABLE"
target = "horizon_client_render::options_ui::layout::OptionsUi::layout"
variable = { name = "list_start", ordinal = 0, at = "STORE" }
require = 1
ordinal = 0
helper = "search.rs"
bindings = [
  { name = "value", ty = "usize", value = "$value" },
  { name = "mappings", ty = "&mut Vec<(&'static str, &'static str)>", value = "$local_mut:mappings:0" },
  { name = "query", ty = "&String", value = "$local_ref:query:0" },
  { name = "s", ty = "&crate::settings::Settings", value = "s" },
]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "controlling"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

