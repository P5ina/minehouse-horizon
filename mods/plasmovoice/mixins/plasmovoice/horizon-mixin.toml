[mod]
id = "plasmovoice"
version = "0.1.0"
priority = 100

# Pinned: besides the native hook points it reads the server's custom payloads
# and the other players' positions inside the game's multiplayer code
# (`game::remote`), which are not part of the stable hook points.
[compatibility]
horizon_revision = "f037744a79f9982c47876f49c5a3067279f88706"

# Simple Voice Chat's protocol, Opus, the sound card and the voice threads.
[[crate]]
id = "engine"
path = "engine"

# Every play packet, first: the voice chat's custom payloads.
[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_client_play_packet"
helper = "packet.rs"
bindings = [
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "packet" },
]

# Each client tick on a server: positions in, payloads out.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "frame"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_frame"
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "key"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_key"
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "hud"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_hud"
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "command"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_command"
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_commands"
kind = "HEAD"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "list"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_mods"
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_settings"
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_settings_click"
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# The voice chat menu (V): the mod's own screen.
[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_render_post"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_mouse_scrolled_pre"
helper = "scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "keys"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_key_pressed_pre"
helper = "keys.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "chars"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_char_typed_pre"
helper = "chars.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
