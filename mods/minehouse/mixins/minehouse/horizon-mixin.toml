[mod]
id = "minehouse"
version = "0.3.0"
priority = 100

[compatibility]
horizon_revision = "f00125f61f794aaa3d4e950d301f353b35b6ee3d"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "minehouse"
source = "runtime.rs"

[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_client_play_packet"
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "packet" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::client_tick_post::Game<'_>::native_client_tick_post"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "zones"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_world_primitives"
helper = "zones.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "primitives", ty = "&mut horizon_client::world_primitives::WorldPrimitives", value = "&mut *primitives" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_render_post"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *draw" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "mouse"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_mouse_button_pressed_pre"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_screen_mouse_scrolled_pre"
helper = "scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The anvil screen (`AnvilScreen.extractLabels`): the real cost in place of the
# 39 the server puts in the data slot...
[[injection]]
id = "anvil-cost"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::stations::draw::Game<'_>::draw_station"
variable = { name = "cost", ordinal = 1, at = "STORE" }
require = 1
ordinal = 0
helper = "anvil_cost.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }]

# ...no "Too Expensive!" while it does (the server has no such limit): the
# `cost >= 40` test reads the clamp instead of the real cost...
[[injection]]
id = "anvil-limit"
kind = "MODIFY_VARIABLE"
target = "horizon_client::game::stations::draw::Game<'_>::draw_station"
variable = { name = "cost", ordinal = 1, at = "LOAD" }
require = 3
ordinal = 1
helper = "anvil_limit.rs"
bindings = [{ name = "value", ty = "i32", value = "$value" }]

# ...and red when the player hasn't the levels for the real cost.
[[injection]]
id = "anvil-take"
kind = "RETURN"
target = "horizon_client::game::stations::Game<'_>::may_take_result"
helper = "anvil_take.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The end of Chapter 1 on the title (`minehouse:chapter_end`): the state lives
# next to the title, which is in the client library, not the game crate...
[[module]]
id = "chapter"
file = "crates/horizon-client/src/title.rs"
name = "minehouse_chapter"
visibility = "pub"
source = "chapter.rs"

# ...the screen goes black and the dot takes the logo's place...
[[injection]]
id = "title-logo"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::title::draw_logo"
helper = "title_logo.rs"
bindings = [
  { name = "atlas", ty = "&HudAtlas", value = "atlas" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "w", ty = "f32", value = "w" },
]

# ...with no splash (the title's frame-by-frame poll)...
[[injection]]
id = "title-splash"
kind = "HEAD"
target = "horizon_client_lib::title::missing_mods::Title::poll_backup"
helper = "title_splash.rs"
bindings = [
  { name = "title", ty = "&mut Title", value = "&mut *self" },
]

# ...and no Realms.
[[injection]]
id = "title-buttons"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::title::preset_buttons::Title::buttons"
helper = "title_buttons.rs"
bindings = [
  { name = "title", ty = "&Title", value = "self" },
  { name = "w", ty = "f32", value = "w" },
  { name = "h", ty = "f32", value = "h" },
]
