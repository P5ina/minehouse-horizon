[mod]
id = "litematica"
version = "1.0.0"
priority = 100

# Pinned: the printer sends its clicks inside the game's multiplayer code
# (`game::remote`'s sequence and carried slot), not a stable hook point.
[compatibility]
horizon_revision = "f037744a79f9982c47876f49c5a3067279f88706"

# .litematic files, placements, the commands and the printer's choices.
[[crate]]
id = "engine"
path = "engine"

# Each client tick on a server (single player too, through its server
# thread): inside the multiplayer code, which keeps the click sequence and
# the slot the server knows is held.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Syncmatica's messages from the server, before the game ignores them.
[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_client_play_packet"
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "packet" },
]

[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_world_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "draw", ty = "&mut crate::game::native_hooks::NativeWorldDraw", value = "&mut *draw" },
]

[[injection]]
id = "prims"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_world_primitives"
helper = "prims.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "[f64; 3]", value = "camera" },
  { name = "primitives", ty = "&mut horizon_client::world_primitives::WorldPrimitives", value = "&mut *primitives" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::minehouse_compat::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
